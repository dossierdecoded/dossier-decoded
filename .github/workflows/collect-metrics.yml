name: Collect metrics

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: collect-metrics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Collect
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/collect_metrics.py
      - name: Save to this repo
        run: |
          git config user.name "dossier-bot"
          git config user.email "dossierdecoded@gmail.com"
          git add metrics
          git diff --cached --quiet || git commit -m "Metrics snapshot"
          git pull --rebase origin main && git push origin HEAD:main
      - name: Publish to dashboard site
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        if: env.SITE_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:${SITE_TOKEN}@github.com/dossierdecoded/dossierdecoded.github.io.git" site
          mkdir -p site/dashboard/data
          cp metrics/latest.json metrics/history.json site/dashboard/data/
          cd site
          git config user.name "dossier-bot"
          git config user.email "dossierdecoded@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "Dashboard data"
          git push
